name: LINKLIAN-QUEUE CI

on:
  pull_request:
    branches: [main, staging]
    paths:
      - '**'

  workflow_dispatch:

concurrency:
  group: ci-queue-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write # needed for SARIF upload

jobs:
  sast:
    name: SAST (gosec)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: worker/go.mod
          cache: true

      - name: Run gosec (SARIF) (non-blocking)
        continue-on-error: true
        working-directory: worker
        run: |
          set -euo pipefail
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          "$HOME/go/bin/gosec" -fmt=sarif -out gosec.sarif ./...

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: worker/gosec.sarif

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    needs: [sast]

    steps:
      - uses: actions/checkout@v4

      # ถ้าอยากให้ไม่ block ให้ใส่ continue-on-error: true
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --redact --no-git

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [secret-scan]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: worker/go.mod
          cache: true

      # (เลือก) fmt เป็น warning ไม่ block แต่โชว์ annotation แบบ warning
      - name: Go fmt check (non-blocking)
        continue-on-error: true
        working-directory: worker
        run: |
          set -euo pipefail
          files="$(gofmt -l . || true)"
          if [[ -n "$files" ]]; then
            echo "Files not formatted:"
            echo "$files"
            echo "Fix with: gofmt -w ."
            for f in $files; do
              echo "::warning file=$f::File not formatted (run: gofmt -w .)"
            done
            exit 1
          fi

      - name: Go vet
        working-directory: worker
        run: |
          set -euo pipefail
          go vet ./...

      - name: Go mod download
        working-directory: worker
        run: |
          set -euo pipefail
          go mod download

      - name: Go build
        working-directory: worker
        run: |
          set -euo pipefail
          go build -v ./...

      - name: Unit tests
        working-directory: worker
        run: |
          set -euo pipefail
          go test -v ./... -count=1

  container-scan:
    name: Docker Build + Trivy
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          set -euo pipefail
          docker build -t linklian-queue:local -f worker/Dockerfile .

      - name: Trivy scan (SARIF) (non-blocking)
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}:/repo \
            aquasec/trivy image \
            --format sarif \
            --output /repo/trivy.sarif \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            linklian-queue:local

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif