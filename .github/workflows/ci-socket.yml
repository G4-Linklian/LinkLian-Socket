name: LINKLIAN-SOCKET CI

# Trigger this workflow on push and pull requests to main/staging branches
# Only trigger when relevant files are changed (Go code, config, Docker, CI workflow)
on:
  push:
    branches: ["main", "staging"]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/ci-socket.yml"
      - "go-ci.sh"
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "nginx/**"
      - "examples/**"

  pull_request:
    branches: ["main", "staging"]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/ci-socket.yml"
      - "go-ci.sh"
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "nginx/**"
      - "examples/**"

concurrency:
  group: ci-socket-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Go CI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Make script executable (non-windows)
        if: runner.os != 'Windows'
        run: chmod +x ./go-ci.sh

      - name: Run Go CI (gofmt/vet/test/build)
        shell: bash
        run: |
          bash ./go-ci.sh all
