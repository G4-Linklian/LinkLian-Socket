name: LINKLIAN-SOCKET CI

on:
  push:
    branches: ["main", "staging"]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/ci-socket.yml"
      - "go-ci.sh"
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "nginx/**"
      - "examples/**"

  pull_request:
    branches: ["main", "staging"]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/ci-socket.yml"
      - "go-ci.sh"
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "nginx/**"
      - "examples/**"

  workflow_dispatch:

concurrency:
  group: ci-socket-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write # needed for SARIF upload (gosec)

jobs:
  sast:
    name: SAST (gosec) -> SARIF (non-blocking)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run gosec (SARIF) (non-blocking)
        continue-on-error: true
        run: |
          set -euo pipefail
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          "$HOME/go/bin/gosec" -fmt=sarif -out gosec.sarif ./...

      - name: Upload SAST report (SARIF)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif

  secret-scan:
    name: Secret Scan (gitleaks)
    needs: [sast]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Gitleaks (Free CLI)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/repo \
            zricethezav/gitleaks:latest \
            detect --source=/repo --verbose --redact --exit-code 1

  ci:
    name: Go CI (fmt/vet/build/test)
    needs: [secret-scan]
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go fmt check
        run: |
          set -euo pipefail
          files="$(gofmt -l . || true)"
          if [[ -n "$files" ]]; then
            echo "Files not formatted:"
            echo "$files"
            echo "Fix with: gofmt -w ."
            exit 1
          fi

      - name: Go vet
        run: |
          set -euo pipefail
          go vet ./...

      - name: Go mod download
        run: |
          set -euo pipefail
          go mod download

      - name: Go build
        run: |
          set -euo pipefail
          go build -v ./...

      - name: Unit tests
        run: |
          set -euo pipefail
          go test -v ./... -count=1