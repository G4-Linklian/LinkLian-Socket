# version: "3.9"

services:
  linklian-api:
    build: .
    # ports:
    #   - "9090:9090"
    expose:
      - "9090"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    command: yarn dev
    
    deploy:
      mode: replicated
      replicas: 3      # รัน 3 Instances พร้อมกัน
      restart_policy:
        condition: on-failure
    
  nginx:
    image: nginx:latest
    container_name: linklian-load-balancer
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - linklian-api