<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkLian — Notification POC</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
    }

    h1 {
      background: #007bff;
      color: #fff;
      padding: 16px 24px;
      font-size: 18px;
    }

    .layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 16px;
      padding: 16px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 16px;
    }

    .card h3 {
      font-size: 14px;
      margin-bottom: 12px;
      color: #333;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }

    .form-group { margin-bottom: 12px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      color: #555;
      margin-bottom: 4px;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 7px 9px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
    }

    button {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 6px;
    }
    .btn-primary { background: #007bff; color: #fff; }
    .btn-danger  { background: #dc3545; color: #fff; }
    .btn-secondary { background: #6c757d; color: #fff; }
    .btn-warning { background: #ffc107; color: #333; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button:hover:not(:disabled) { filter: brightness(0.9); }

    .status {
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 12px;
    }
    .status.connected    { background: #d4edda; color: #155724; }
    .status.disconnected { background: #f8d7da; color: #721c24; }
    .status.connecting   { background: #fff3cd; color: #856404; }

    /* Notification feed */
    .feed-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }
    .feed-header h3 { flex: 1; font-size: 14px; color: #333; }

    #unread-badge {
      background: #dc3545;
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      padding: 2px 7px;
      border-radius: 999px;
      display: none;
    }

    #notification-feed {
      max-height: 380px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .noti-item {
      border: 1px solid #dee2e6;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
      background: #f8f9fa;
      border-left: 4px solid #adb5bd;
      animation: fadeIn 0.2s ease;
    }
    .noti-item.unread { background: #eef2ff; border-left-color: #007bff; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .noti-top {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .noti-ref-type {
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 3px;
      font-weight: bold;
      text-transform: uppercase;
      background: #e0e7ff;
      color: #3730a3;
    }
    .noti-title { font-weight: bold; flex: 1; color: #212529; }
    .noti-time  { font-size: 10px; color: #adb5bd; }

    .noti-body  { color: #495057; margin-bottom: 6px; }

    .noti-meta  { font-size: 11px; color: #868e96; }

    .noti-raw {
      margin-top: 6px;
      background: #fff;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      padding: 6px 8px;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      color: #495057;
      white-space: pre-wrap;
      word-break: break-all;
      display: none;
    }

    .toggle-raw {
      width: auto;
      padding: 0;
      font-size: 11px;
      color: #007bff;
      background: none;
      margin: 0;
      font-weight: normal;
    }

    .empty-state {
      text-align: center;
      padding: 40px 0;
      color: #adb5bd;
      font-size: 13px;
    }

    /* Log */
    #log {
      height: 180px;
      overflow-y: auto;
      background: #212529;
      border-radius: 6px;
      padding: 10px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
    }
    .log-line { margin-bottom: 2px; }
    .log-line.info  { color: #6c757d; }
    .log-line.ok    { color: #28a745; }
    .log-line.warn  { color: #ffc107; }
    .log-line.error { color: #dc3545; }
  </style>
</head>
<body>

<h1>🔔 LinkLian — Notification POC (Socket)</h1>

<div class="layout">
  <!-- Left: Config -->
  <aside>
    <div class="card">
      <div id="status-bar" class="status disconnected">Disconnected ❌</div>

      <h3>Connection</h3>
      <div class="form-group">
        <label>WebSocket URL</label>
        <input type="text" id="ws-url" value="ws://localhost:4800/ws" />
      </div>
      <div class="form-group">
        <label>User ID</label>
        <input type="number" id="user-id" value="1" min="1" />
      </div>
      <button class="btn-primary" onclick="connect()">Connect</button>
      <button class="btn-danger"  onclick="disconnect()">Disconnect</button>
    </div>

    <div class="card" style="margin-top:12px;">
      <h3>Actions</h3>
      <button class="btn-primary"   onclick="registerNoti()" id="btn-register" disabled>🔔 Register Notification</button>
      <button class="btn-warning"   onclick="markAllRead()">✓ Mark all read</button>
      <button class="btn-secondary" onclick="clearFeed()">Clear notifications</button>
      <button class="btn-secondary" onclick="clearLog()">Clear log</button>
    </div>

    <div class="card" style="margin-top:12px;">
      <h3>Mark as Read</h3>
      <div class="form-group">
        <label>Notification ID</label>
        <input type="text" id="noti-id-input" placeholder="เช่น 42" />
      </div>
      <button class="btn-primary" onclick="readNotification()" id="btn-read" disabled>📖 READ_NOTI</button>
    </div>
  </aside>

  <!-- Right: Feed + Log -->
  <div style="display:flex;flex-direction:column;gap:12px;">
    <div class="card">
      <div class="feed-header">
        <h3>Notifications</h3>
        <span id="unread-badge">0</span>
      </div>
      <div id="notification-feed">
        <div class="empty-state" id="empty-state">ยังไม่มี notification — Connect แล้วกด Register</div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:8px;">Log</h3>
      <div id="log">
        <div class="log-line info">[system] Notification POC ready</div>
      </div>
    </div>
  </div>
</div>

<script>
  let ws = null;
  let unread = 0;

  // ── Connection ─────────────────────────────────────────────────────────────

  function connect() {
    const url    = document.getElementById('ws-url').value.trim();
    const userId = document.getElementById('user-id').value.trim();

    if (!url) { log('error', 'กรอก WebSocket URL ก่อน'); return; }
    if (ws && ws.readyState === WebSocket.OPEN) { log('warn', 'Connected อยู่แล้ว'); return; }

    setStatus('connecting');
    log('info', `Connecting → ${url}`);

    ws = new WebSocket(url);

    ws.onopen = () => {
      setStatus('connected');
      log('ok', 'Connected');
      document.getElementById('btn-register').disabled = false;
      document.getElementById('btn-read').disabled = false;
    };

    ws.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);
        handleMessage(data);
      } catch {
        log('warn', `Non-JSON: ${e.data}`);
      }
    };

    ws.onerror = () => {
      log('error', 'WebSocket error');
      setStatus('disconnected');
    };

    ws.onclose = (e) => {
      log('warn', `Disconnected (code ${e.code})`);
      setStatus('disconnected');
      document.getElementById('btn-register').disabled = true;
      document.getElementById('btn-read').disabled = true;
      ws = null;
    };
  }

  function disconnect() {
    if (ws) ws.close();
  }

  // ── Send helpers ───────────────────────────────────────────────────────────

  function send(msg) {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      log('error', 'ยังไม่ได้ connect');
      return;
    }
    ws.send(JSON.stringify(msg));
    log('info', `→ ${msg.type}`);
  }

  function registerNoti() {
    const userId = document.getElementById('user-id').value.trim();
    send({ type: 'REGISTER_NOTI', payload: { user_id: userId } });
    log('ok', `Registered noti for user ${userId}`);
  }

  function readNotification() {
    const id = document.getElementById('noti-id-input').value.trim();
    if (!id) { log('error', 'กรอก Notification ID ก่อน'); return; }
    send({ type: 'READ_NOTI', payload: { notificationID: id } });

    // mark in UI
    const el = document.getElementById(`noti-${id}`);
    if (el) el.classList.remove('unread');
  }

  // ── Message Handler ────────────────────────────────────────────────────────

  function handleMessage(data) {
    log('ok', `← ${data.type}`);

    if (data.type === 'NOTIFICATION') {
      const p = data.payload || {};
      const userId = document.getElementById('user-id').value.trim();

      // only show notifications for this user
      if (p.receive_user_id && String(p.receive_user_id) !== String(userId)) {
        log('info', `Skip (for user ${p.receive_user_id})`);
        return;
      }

      addNoti({
        id:       p.notification_id || Date.now(),
        ref_type: p.ref_type  || '—',
        title:    p.title     || '(no title)',
        body:     p.body      || '',
        actor:    p.actor_name || '—',
        ref_id:   p.ref_id    || '—',
        raw:      data,
        ts:       new Date(),
      });
    }
  }

  // ── Notification Feed ──────────────────────────────────────────────────────

  function addNoti(noti) {
    document.getElementById('empty-state').style.display = 'none';
    unread++;
    updateBadge();

    const feed = document.getElementById('notification-feed');
    const el   = document.createElement('div');
    el.className = 'noti-item unread';
    el.id = `noti-${noti.id}`;

    el.innerHTML = `
      <div class="noti-top">
        <span class="noti-ref-type">${esc(noti.ref_type)}</span>
        <span class="noti-title">${esc(noti.title)}</span>
        <span class="noti-time">${noti.ts.toLocaleTimeString('th-TH')}</span>
      </div>
      <div class="noti-body">${esc(noti.body)}</div>
      <div class="noti-meta">actor: ${esc(noti.actor)} · ref_id: ${esc(String(noti.ref_id))} · id: ${esc(String(noti.id))}</div>
      <button class="toggle-raw" onclick="toggleRaw('${noti.id}')">▶ raw JSON</button>
      <pre class="noti-raw" id="raw-${noti.id}">${esc(JSON.stringify(noti.raw, null, 2))}</pre>
    `;

    // newest on top
    feed.insertBefore(el, feed.firstChild);
  }

  function toggleRaw(id) {
    const pre = document.getElementById(`raw-${id}`);
    const btn = pre.previousElementSibling;
    const show = pre.style.display !== 'block';
    pre.style.display = show ? 'block' : 'none';
    btn.textContent = show ? '▼ raw JSON' : '▶ raw JSON';
  }

  function markAllRead() {
    unread = 0;
    updateBadge();
    document.querySelectorAll('.noti-item.unread').forEach(el => el.classList.remove('unread'));
  }

  function clearFeed() {
    document.getElementById('notification-feed').innerHTML =
      '<div class="empty-state" id="empty-state">ยังไม่มี notification</div>';
    unread = 0;
    updateBadge();
  }

  function updateBadge() {
    const b = document.getElementById('unread-badge');
    if (unread > 0) { b.style.display = 'inline-block'; b.textContent = unread > 99 ? '99+' : unread; }
    else b.style.display = 'none';
  }

  // ── Log ───────────────────────────────────────────────────────────────────

  function log(level, msg) {
    const panel = document.getElementById('log');
    const time  = new Date().toLocaleTimeString('th-TH');
    const el    = document.createElement('div');
    el.className = `log-line ${level}`;
    el.textContent = `[${time}] ${msg}`;
    panel.appendChild(el);
    panel.scrollTop = panel.scrollHeight;
  }

  function clearLog() {
    document.getElementById('log').innerHTML = '';
  }

  // ── Status ────────────────────────────────────────────────────────────────

  function setStatus(state) {
    const el = document.getElementById('status-bar');
    const map = {
      connected:    ['status connected',    'Connected ✅'],
      disconnected: ['status disconnected', 'Disconnected ❌'],
      connecting:   ['status connecting',   'Connecting...'],
    };
    el.className = map[state][0];
    el.textContent = map[state][1];
  }

  // ── Utils ─────────────────────────────────────────────────────────────────

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
