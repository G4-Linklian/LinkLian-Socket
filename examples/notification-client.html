<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkLian Notification Socket Client</title>
    <style>
        :root {
            --bg-dark: #0b1218;
            --bg-light: #f7efe5;
            --card: #fffaf2;
            --ink: #1f2937;
            --muted: #6b7280;
            --brand: #e76f51;
            --brand-dark: #d45e41;
            --accent: #2a9d8f;
            --accent-dark: #21867a;
            --warn: #e63946;
            --shadow: 0 20px 45px rgba(15, 23, 42, 0.18);
            --line: #e2d6c6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Franklin Gothic Medium", "Trebuchet MS", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 15% 12%, rgba(231, 111, 81, 0.25), transparent 35%),
                radial-gradient(circle at 85% 8%, rgba(42, 157, 143, 0.22), transparent 32%),
                linear-gradient(160deg, #fff3e4, #f8fbff 35%, #f3efe7);
            min-height: 100vh;
            padding: 24px;
        }

        .shell {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            gap: 16px;
        }

        .hero {
            background: var(--bg-dark);
            color: #f8fafc;
            border-radius: 18px;
            padding: 18px 20px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .hero::after {
            content: "";
            position: absolute;
            right: -80px;
            top: -120px;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(231, 111, 81, 0.55), transparent 65%);
            opacity: 0.7;
        }

        .hero h1 {
            margin: 0 0 6px;
            font-size: clamp(26px, 3vw, 36px);
            letter-spacing: 0.4px;
        }

        .hero p {
            margin: 0;
            color: rgba(255, 255, 255, 0.75);
            font-size: 14px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            padding: 6px 10px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.12);
        }

        .grid {
            display: grid;
            gap: 16px;
            grid-template-columns: 1.05fr 1fr;
        }

        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #374151;
            margin-bottom: 6px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
            background: #fff;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .row {
            display: grid;
            gap: 12px;
        }

        .row.two {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 10px 14px;
            font-weight: 700;
            cursor: pointer;
            background: var(--brand);
            color: #fff;
            transition: transform 0.15s ease, background 0.2s ease;
        }

        button:hover {
            background: var(--brand-dark);
            transform: translateY(-1px);
        }

        button:disabled {
            background: #9aa1a9;
            cursor: not-allowed;
            transform: none;
        }

        .secondary {
            background: #2f3944;
        }

        .secondary:hover {
            background: #222b33;
        }

        .accent {
            background: var(--accent);
        }

        .accent:hover {
            background: var(--accent-dark);
        }

        .warn {
            background: var(--warn);
        }

        .warn:hover {
            background: #cf2f3b;
        }

        .log {
            border: 1px solid #101926;
            border-radius: 12px;
            background: #101826;
            color: #e2e8f0;
            min-height: 420px;
            max-height: 520px;
            overflow: auto;
            padding: 12px;
            font-family: "Consolas", "Courier New", monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }

        .inbox {
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fff;
            padding: 12px;
            min-height: 160px;
            max-height: 240px;
            overflow: auto;
            display: grid;
            gap: 10px;
        }

        .noti-item {
            border: 1px solid #f2d9c8;
            background: #fff5eb;
            border-radius: 10px;
            padding: 10px 12px;
            display: grid;
            gap: 4px;
        }

        .noti-title {
            font-weight: 700;
            color: #7c2d12;
            font-size: 13px;
        }

        .noti-body {
            font-size: 13px;
            color: #374151;
        }

        .noti-meta {
            font-size: 11px;
            color: var(--muted);
        }

        .empty-state {
            color: var(--muted);
            font-size: 12px;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            background: #ffe3d6;
            color: #9a3412;
        }

        .note {
            margin-top: 8px;
            font-size: 12px;
            color: var(--muted);
        }

        @media (max-width: 980px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .row.two {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="shell">
        <section class="hero">
            <h1>LinkLian Notification Socket Client</h1>
            <p>Register by user_sys_id, send to multiple users, and receive notifications in real time.</p>
            <div id="status" class="status">Disconnected</div>
        </section>

        <section class="grid">
            <article class="card">
                <div class="row">
                    <div>
                        <label for="serverUrl">Socket URL</label>
                        <input id="serverUrl" type="text" value="ws://localhost:4800/ws/noti">
                    </div>
                    <div class="btn-row">
                        <button id="connectBtn" onclick="connectSocket()">Connect</button>
                        <button id="disconnectBtn" class="secondary" onclick="disconnectSocket()"
                            disabled>Disconnect</button>
                        <button class="secondary" onclick="clearLog()">Clear Log</button>
                    </div>
                </div>

                <hr>

                <div class="row two">
                    <div>
                        <label for="registerUserId">Your user_sys_id (register)</label>
                        <input id="registerUserId" type="text" value="user_sys_001">
                    </div>
                    <div>
                        <label>&nbsp;</label>
                        <button id="registerBtn" class="accent" onclick="registerNoti()">Register Receive</button>
                        <div class="note">Will send REGISTER_NOTI with user_sys_id.</div>
                    </div>
                </div>

                <hr>

                <div class="row">
                    <div>
                        <label for="targetUserIds">Target user_sys_id list (comma separated)</label>
                        <input id="targetUserIds" type="text" value="user_sys_002,user_sys_003">
                    </div>
                    <div class="row two">
                        <div>
                            <label for="notiTitle">Notification title</label>
                            <input id="notiTitle" type="text" value="New Activity">
                        </div>
                        <div>
                            <label for="notiType">Notification type</label>
                            <input id="notiType" type="text" value="SYSTEM">
                        </div>
                    </div>
                    <div>
                        <label for="notiBody">Notification body</label>
                        <textarea id="notiBody" placeholder="Type notification content..."></textarea>
                    </div>
                    <div>
                        <label for="notiMeta">Metadata (optional JSON)</label>
                        <textarea id="notiMeta" placeholder='{ "ref_id": "123", "source": "demo" }'></textarea>
                    </div>
                    <div class="btn-row">
                        <button class="warn" onclick="sendNotification()">Send Notification</button>
                        <span class="pill">SEND_NOTIFICATION</span>
                    </div>
                </div>
            </article>

            <article class="card">
                <!-- <div class="btn-row" style="justify-content: space-between; margin-bottom: 8px;">
                    <strong>Notification Inbox</strong>
                    <span id="inboxCount" class="pill">0 new</span>
                </div> -->
                <!-- <div id="inbox" class="inbox">
                    <div class="empty-state">Register and wait for notifications.</div>
                </div> -->

                <div class="btn-row" style="justify-content: space-between; margin: 16px 0 8px;">
                    <strong>Socket Log</strong>
                </div>
                <div id="log" class="log"></div>
            </article>
        </section>
    </div>

    <script>
        let ws = null;
        let connected = false;
        let logSeq = 0;
        let registeredUserId = '';
        let notifications = [];

        function logLine(label, payload, isError) {
            const log = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            const status = isError ? 'ERR' : 'OK';
            let line = '[' + time + '] #' + (logSeq += 1) + ' ' + status + ' ' + label;
            if (payload !== undefined) {
                line += '\n' + JSON.stringify(payload, null, 2);
            }
            line += '\n--------------------------------------------------\n';
            log.textContent += line;
            log.scrollTop = log.scrollHeight;
        }

        function updateStatus() {
            const status = document.getElementById('status');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');

            if (connected && registeredUserId) {
                status.textContent = 'Connected as ' + registeredUserId;
            } else {
                status.textContent = connected ? 'Connected' : 'Disconnected';
            }
            connectBtn.disabled = connected;
            disconnectBtn.disabled = !connected;
        }

        function renderInbox() {
            const inbox = document.getElementById('inbox');
            const inboxCount = document.getElementById('inboxCount');

            inbox.innerHTML = '';

            if (notifications.length === 0) {
                inbox.innerHTML = '<div class="empty-state">Register and wait for notifications.</div>';
                inboxCount.textContent = '0 new';
                return;
            }

            inboxCount.textContent = notifications.length + ' new';

            notifications.slice().reverse().forEach(function (item) {
                const wrapper = document.createElement('div');
                wrapper.className = 'noti-item';

                const title = document.createElement('div');
                title.className = 'noti-title';
                title.textContent = item.title || 'Notification';

                const body = document.createElement('div');
                body.className = 'noti-body';
                body.textContent = item.body || JSON.stringify(item.data || item, null, 2);

                const meta = document.createElement('div');
                meta.className = 'noti-meta';
                meta.textContent = item.time;

                wrapper.appendChild(title);
                wrapper.appendChild(body);
                wrapper.appendChild(meta);
                inbox.appendChild(wrapper);
            });
        }

        // function addNotification(payload) {
        //     const data = payload && payload.data ? payload.data : payload;
        //     notifications.push({
        //         title: data && data.title ? data.title : 'Notification',
        //         body: data && data.body ? data.body : '',
        //         data: data,
        //         time: new Date().toLocaleString()
        //     });
        //     renderInbox();
        // }

        function connectSocket() {
            const url = document.getElementById('serverUrl').value.trim();
            if (!url) {
                alert('Please enter socket URL');
                return;
            }

            ws = new WebSocket(url);

            ws.onopen = function () {
                connected = true;
                updateStatus();
                logLine('OUT: CONNECT', { url: url });
            };

            ws.onmessage = function (event) {
                let data;
                try {
                    data = JSON.parse(event.data);
                } catch (err) {
                    logLine('IN: RAW', event.data);
                    return;
                }

                // logLine('IN: ' + data.type, data.payload);

                console.log('Received message:', data);

                if (data.type === 'NOTI_RECEIVE') {
                    logLine('NOTIFICATION RECEIVED', data.payload);
                    // addNotification(data.payload);
                }
            };

            ws.onclose = function () {
                connected = false;
                updateStatus();
                logLine('SYS: Socket Closed', null, true);
            };

            ws.onerror = function () {
                logLine('SYS: Socket Error', null, true);
            };
        }

        function disconnectSocket() {
            if (ws) ws.close();
        }

        function sendSocketMessage(type, payload) {
            if (!connected || !ws || ws.readyState !== WebSocket.OPEN) {
                logLine('OUT BLOCKED: ' + type, { reason: 'Socket not connected' }, true);
                return false;
            }
            ws.send(JSON.stringify({ type: type, payload: payload }));
            logLine('OUT: ' + type, payload);
            return true;
        }

        function registerNoti() {
            const userSysId = document.getElementById('registerUserId').value.trim();
            if (!userSysId) {
                alert('Please enter user_sys_id');
                return;
            }

            sendSocketMessage('REGISTER_NOTI', { user_sys_id: userSysId });
            registeredUserId = userSysId;
            updateStatus();
        }

        function parseTargets() {
            const raw = document.getElementById('targetUserIds').value;
            return raw
                .split(',')
                .map(function (item) { return item.trim(); })
                .filter(Boolean);
        }

        function parseMeta() {
            const raw = document.getElementById('notiMeta').value.trim();
            if (!raw) return null;
            try {
                return JSON.parse(raw);
            } catch (err) {
                logLine('META JSON INVALID', { error: err.message }, true);
                return null;
            }
        }

        function sendNotification() {
            const senderId = document.getElementById('registerUserId').value.trim();
            const targets = parseTargets();
            const title = document.getElementById('notiTitle').value.trim();
            const body = document.getElementById('notiBody').value.trim();
            const notiType = document.getElementById('notiType').value.trim();
            const meta = parseMeta();

            if (!senderId || targets.length === 0 || !title || !body) {
                alert('Please enter sender, targets, title, and body');
                return;
            }

            const payload = {
                sender_id: senderId,
                target_user_sys_ids: targets,
                data: {
                    title: title,
                    body: body,
                    type: notiType || 'SYSTEM',
                    meta: meta
                }
            };

            sendSocketMessage('SEND_NOTIFICATION', payload);
        }

        function clearLog() {
            document.getElementById('log').textContent = '';
        }

        updateStatus();
        renderInbox();
    </script>
</body>

</html>
