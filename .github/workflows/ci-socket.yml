name: LINKLIAN-SOCKET CI

# Trigger this workflow on push and pull requests to main/staging branches
# Only trigger when relevant files are changed (Go code, config, Docker, CI workflow)
on:
  push:
    branches: ["main,staging"]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/ci-socket.yml"
      - "go-ci.sh"
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "nginx/**"
      - "examples/**"

  pull_request:
    branches: ["main,staging"]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/ci-socket.yml"
      - "go-ci.sh"
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "nginx/**"
      - "examples/**"

# Prevent multiple workflow runs on the same branch
# If a new push happens before previous run finishes, cancel the old one
concurrency:
  group: ci-socket-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Main CI job: Run tests and builds on multiple OS
  ci:
    name: Go CI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Test on Linux, macOS, and Windows to ensure cross-platform compatibility
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      # Fetch the repository code
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Go environment from version specified in go.mod
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Run Go code quality checks: formatting, vetting, tests, build
      - name: Run Go CI (gofmt/vet/test/build)
        shell: bash
        run: |
          chmod +x ./go-ci.sh
          ./go-ci.sh all

