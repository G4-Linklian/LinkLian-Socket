version: '3.8'

services:
  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: linklian-rabbitmq
    hostname: rabbitmq-server
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      timeout: 10s
      retries: 5
    networks:
      - linklian-network

  # Go WebSocket Server
  linklian-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linklian-api-server
    ports:
      - "7070:7070"
    environment:
      PORT: 7070
      RABBITMQ_URL: amqp://user:password@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - linklian-network
    restart: unless-stopped

volumes:
  rabbitmq_data:
    driver: local

networks:
  linklian-network:
    driver: bridge